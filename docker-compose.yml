services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5441}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-simple_invoice}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/be/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-4001}:4001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-simple_invoice}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/fe/Dockerfile
    restart: unless-stopped
    ports:
      - "3041:80"
    depends_on:
      - backend

volumes:
  pgdata:
